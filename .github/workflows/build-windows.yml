name: Build StemSplit AI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      with_onnx:
        description: "Also link ONNX Runtime (experimental)"
        type: boolean
        default: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: macOS,   os: macos-latest }
          - { name: Linux,   os: ubuntu-22.04 }

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxcomposite-dev libxext-dev libxrender-dev libfreetype-dev \
            libfontconfig1-dev libgl1-mesa-dev

      - name: Fetch ONNX Runtime (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.with_onnx }}
        shell: bash
        run: |
          V=1.20.1
          case "${{ runner.os }}" in
            Windows) F=onnxruntime-win-x64-$V.zip ;;
            macOS)   F=onnxruntime-osx-universal2-$V.tgz ;;
            Linux)   F=onnxruntime-linux-x64-$V.tgz ;;
          esac
          mkdir -p "$GITHUB_WORKSPACE/ort"
          curl -L "https://github.com/microsoft/onnxruntime/releases/download/v$V/$F" -o "$GITHUB_WORKSPACE/ort/$F"
          cmake -E tar xf "$GITHUB_WORKSPACE/ort/$F" --format=zip 2>/dev/null || cmake -E tar xf "$GITHUB_WORKSPACE/ort/$F"
          ROOT=$(ls -d "$GITHUB_WORKSPACE"/ort/onnxruntime-*/ | head -1)
          echo "ORT_ROOT=${ROOT//\\//}" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          ARGS=()
          if [ -n "$ORT_ROOT" ]; then ARGS+=("-DSTEMSPLIT_ONNX=ON" "-DONNXRUNTIME_ROOT=$ORT_ROOT"); fi
          if [ "${{ runner.os }}" = "macOS" ]; then ARGS+=("-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"); fi
          cmake -B build -DCMAKE_BUILD_TYPE=Release "${ARGS[@]}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: bash
        run: |
          cd build/StemSplit_artefacts/Release
          cmake -E tar cf "$GITHUB_WORKSPACE/StemSplitAI-${{ matrix.name }}.zip" --format=zip VST3 Standalone

      - uses: actions/upload-artifact@v4
        with:
          name: StemSplitAI-${{ matrix.name }}
          path: StemSplitAI-${{ matrix.name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
